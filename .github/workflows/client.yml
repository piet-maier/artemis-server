name: Client Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - client/**

permissions:
  contents: read

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: client
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          working-directory: client
          require-lockfile: true
      - name: Run Type Check
        run: pnpm run type-check
      - name: Run ESLint
        run: pnpm run lint
      - name: Run Prettier
        run: pnpm run format
      - name: Run Vitest
        run: pnpm run test:unit
