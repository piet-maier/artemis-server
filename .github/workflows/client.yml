name: Client Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - client/**

permissions:
  contents: read

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: client
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm i
      - name: Run ESLint
        run: npm run lint
      - name: Run Prettier
        run: npm run format
